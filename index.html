<h1>個人用の自動化ツール</h1>
<p>このページは、個人が自分のパソコンで使っている小さな自動化ツールの説明です。一般には公開・配布していません。利用者は作成者本人だけです。</p>
<h2>ツール</h2>
<ul>
<li><strong>morning-brief</strong>：本人の Google カレンダーと Gmail を読み取り（読み取りのみ）、毎朝の予定とメールの要約を本人のスマートフォンに通知します。</li>
<li><strong>youtube-organizer</strong>：本人の YouTube チャンネルの動画の題名・タグ・再生リストを整理します。</li>
</ul>
